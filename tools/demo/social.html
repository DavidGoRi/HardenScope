<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HardenScope social preview</title>
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { background: radial-gradient(1200px 640px at 85% 20%, #1d2a44 0%, #111418 60%); color: #e7eaee;
    font-family: "Segoe UI", system-ui, sans-serif; display: flex; align-items: center; justify-content: space-between;
    box-sizing: border-box; padding: 0 76px; }
  .text { width: 660px; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 64px; font-weight: 700; letter-spacing: -.01em; }
  .brand svg { width: 72px; height: 72px; color: #6c9cff; }
  .tag { font-size: 30px; color: #c4cad3; margin: 22px 0 30px; line-height: 1.35; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { border: 1px solid #39414d; border-radius: 999px; padding: 6px 16px; font-size: 20px; color: #c4cad3; }
  .card { box-sizing: border-box; background: #1a1e24; border: 1px solid #2b313a; border-radius: 18px; padding: 32px 36px; width: 400px; }
  .ring { position: relative; width: 210px; height: 210px; margin: 0 auto 18px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .v { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .n { font-size: 64px; font-weight: 700; line-height: 1; }
  .ring .o { color: #9aa3ae; font-size: 18px; }
  .row { display: flex; justify-content: space-between; font-size: 20px; padding: 7px 0; border-top: 1px solid #2b313a; }
  .bad { color: #ff6b5e; font-weight: 600; } .good { color: #4cc283; font-weight: 600; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/><path d="m9 12 2 2 4-4"/></svg>
      HardenScope
    </div>
    <div class="tag">Read-only security hardening audit for Windows fleets: a score, the fixes that matter most and what changed since last time.</div>
    <div class="chips"><span class="chip">PowerShell 5.1</span><span class="chip">33 CIS-aligned checks</span><span class="chip">WinRM fleets</span><span class="chip">EN · ES</span></div>
  </div>
  <div class="card">
    <div class="ring">
      <svg width="210" height="210" viewBox="0 0 210 210" aria-hidden="true">
        <circle cx="105" cy="105" r="88" fill="none" stroke="#2b313a" stroke-width="18"/>
        <circle cx="105" cy="105" r="88" fill="none" stroke="#f0c445" stroke-width="18" stroke-linecap="round" stroke-dasharray="387 999"/>
      </svg>
      <div class="v"><span class="n">70</span><span class="o">grade C</span></div>
    </div>
    <div class="row"><span>SMBv1 disabled</span><span class="bad">Failed</span></div>
    <div class="row"><span>BitLocker on</span><span class="bad">New</span></div>
    <div class="row"><span>Secure Boot</span><span class="good">Fixed</span></div>
  </div>
</body>
</html>
